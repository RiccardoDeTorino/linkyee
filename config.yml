# =============================================================================
# linkyee — Site Configuration
#
# This file is rendered through Liquid: every {{ ... }} below is evaluated
# at build time. Plugin output lives under `vars.<PluginName>` — see
# `plugins/README.md` for the full plugin developer wiki.
# =============================================================================

theme: terminal-retro
lang: "en"
color_scheme: dark

plugins:
  - GithubRepoStarsCountPlugin:
      - ZhgChgLi/ZMarkupParser
      - ZhgChgLi/ZReviewTender
      - ZhgChgLi/ZMediumToMarkdown
      - ZhgChgLi/linkyee
  - GithubLastCommitPlugin:
      - ZhgChgLi/linkyee
  - GithubProfilePlugin:
      - ZhgChgLi
  - RSSFeedPlugin:
      - https://riccardodetorino.substack.com/feed
      - https://unlikedvalentine.substack.com/feed
  - CountdownPlugin:
      linkyee_release: "2024-12-21"
  - YouTubeChannelLatestVideoPlugin:
      - "https://www.youtube.com/@TheGoodTheBadTheU.G.L.Y"
      - "https://www.youtube.com/@BehindTheVeil33"
  - OdyseeChannelLatestVideoPlugin:
      - "@BehindTheVeil33"

google_analytics_id:
title: "Follow The White Rabbit"
avatar: "./images/profile.jpeg"
name: "Riccardo DeTorino"
tagline: >-
  Just a simple guy...<br>

links:
  - link:
      icon: "fa-brands fa-substack"
      text: "{{ vars.RSSFeedPlugin['https://riccardodetorino.substack.com/feed'][0].title | default: 'The Ninety-Day Ratchet' }}"
      url: "{{ vars.RSSFeedPlugin['https://riccardodetorino.substack.com/feed'][0].url | default: 'https://riccardodetorino.substack.com/p/the-ninety-day-ratchet' }}"
      alt: "Latest post on Riccardo DeTorino's Substack"
      title: "Latest post on Riccardo DeTorino's Substack"
      target: "_blank"
      latest: true
  - link:
      icon: "fa-brands fa-substack"
      text: "{{ vars.RSSFeedPlugin['https://unlikedvalentine.substack.com/feed'][0].title | default: 'The Invisible Template' }}"
      url: "{{ vars.RSSFeedPlugin['https://unlikedvalentine.substack.com/feed'][0].url | default: 'https://unlikedvalentine.substack.com/p/the-invisible-template' }}"
      alt: "Latest post on UnlikedValentine's Substack"
      title: "Latest post on UnlikedValentine's Substack"
      target: "_blank"
      latest: true
  - link:
      icon: "fa-brands fa-youtube"
      text: "{{ vars.YouTubeChannelLatestVideoPlugin['https://www.youtube.com/@TheGoodTheBadTheU.G.L.Y'].title | default: 'Latest TheGoodTheBadTheU.G.L.Y video' }}"
      url: "{{ vars.YouTubeChannelLatestVideoPlugin['https://www.youtube.com/@TheGoodTheBadTheU.G.L.Y'].url | default: 'https://www.youtube.com/@TheGoodTheBadTheU.G.L.Y' }}"
      alt: "Latest TheGoodTheBadTheU.G.L.Y video"
      title: "Latest TheGoodTheBadTheU.G.L.Y video"
      target: "_blank"
      latest: true
  - link:
      icon: "fa-brands fa-youtube"
      text: "{{ vars.YouTubeChannelLatestVideoPlugin['https://www.youtube.com/@BehindTheVeil33'].title | default: 'Latest BehindTheVeil video' }}"
      url: "{{ vars.YouTubeChannelLatestVideoPlugin['https://www.youtube.com/@BehindTheVeil33'].url | default: 'https://www.youtube.com/@BehindTheVeil33' }}"
      alt: "Latest BehindTheVeil video"
      title: "Latest BehindTheVeil video"
      target: "_blank"
      latest: true
  - link:
      icon: "fa-brands fa-odysee"
      text: "{{ vars.OdyseeChannelLatestVideoPlugin['@BehindTheVeil33'].title | default: 'Latest BehindTheVeil Odysee video' }}"
      url: "{{ vars.OdyseeChannelLatestVideoPlugin['@BehindTheVeil33'].url | default: 'https://odysee.com/@BehindTheVeil33' }}"
      alt: "Latest BehindTheVeil Odysee video"
      title: "Latest BehindTheVeil Odysee video"
      target: "_blank"
      latest: true
  - link:
      icon: "fa-solid fa-mug-hot"
      text: "Buy Me a Coffee"
      url: "https://buymeacoffee.com/riccardodetorino" # Replace with your Buy Me a Coffee profile URL
      alt: "Support Riccardo DeTorino on Buy Me a Coffee"
      title: "Buy Me a Coffee"
      target: "_blank"

socials:
  - social:
      icon: "fa-brands fa-matrix"
      url: "https://matrix.to/#/#thegoodthebadtheugly:unredacted.org"
      title: "Matrix Space"
      alt: "Matrix Space"
      target: "_blank"
  - social:
      icon: "fa-brands fa-twitter"
      url: "https://x.com/DeTorino33"
      title: "Riccardo DeTorino's Twitter"
      alt: "Riccardo DeTorino's Twitter"
      target: "_blank"
  - social:
      icon: "fa-regular fa-envelope"
      url: "riccardodetorino@tutanota.com"
      title: "Riccardo DeTorino's Email"
      alt: "Riccardo DeTorino's Email"
      target: "_blank"

footer: >

copyright: >
  © {{ year }} <a href="https://link.zhgchg.li" target="_blank">ZhgChgLi</a>. Powered by <a href="https://github.com/ZhgChgLi/linkyee" target="_blank">linkyee</a>
