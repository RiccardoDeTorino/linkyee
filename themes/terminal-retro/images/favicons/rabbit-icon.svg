<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0f0a"/>
      <stop offset="100%" style="stop-color:#1a1f18"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" rx="80"/>
  <g transform="translate(256, 280)">
    <!-- Rabbit body -->
    <ellipse cx="0" cy="40" rx="80" ry="70" fill="white" opacity="0.95"/>
    <!-- Rabbit head -->
    <ellipse cx="0" cy="-60" rx="65" ry="55" fill="white" opacity="0.95"/>
    <!-- Ears -->
    <ellipse cx="-45" cy="-130" rx="18" ry="55" fill="white" opacity="0.95" transform="rotate(-15)"/>
    <ellipse cx="45" cy="-130" rx="18" ry="55" fill="white" opacity="0.95" transform="rotate(15)"/>
    <!-- Ear insides -->
    <ellipse cx="-45" cy="-130" rx="8" ry="35" fill="#ffb6c1" opacity="0.9" transform="rotate(-15)"/>
    <ellipse cx="45" cy="-130" rx="8" ry="35" fill="#ffb6c1" opacity="0.9" transform="rotate(15)"/>
    <!-- Eyes -->
    <ellipse cx="-22" cy="-70" rx="10" ry="14" fill="#1a1f18"/>
    <ellipse cx="22" cy="-70" rx="10" ry="14" fill="#1a1f18"/>
    <!-- Eye highlights -->
    <circle cx="-18" cy="-74" r="3" fill="white" opacity="0.8"/>
    <circle cx="26" cy="-74" r="3" fill="white" opacity="0.8"/>
    <!-- Nose -->
    <ellipse cx="0" cy="-45" rx="6" ry="5" fill="#ffb6c1"/>
    <!-- Whiskers -->
    <g stroke="#1a1f18" stroke-width="2" opacity="0.7">
      <line x1="-50" y1="-40" x2="-80" y2="-45"/>
      <line x1="-50" y1="-35" x2="-80" y2="-30"/>
      <line x1="-50" y1="-30" x2="-80" y2="-25"/>
      <line x1="50" y1="-40" x2="80" y2="-45"/>
      <line x1="50" y1="-35" x2="80" y2="-30"/>
      <line x1="50" y1="-30" x2="80" y2="-25"/>
    </g>
    <!-- Front paws -->
    <ellipse cx="-50" cy="60" rx="20" ry="15" fill="white" opacity="0.95"/>
    <ellipse cx="50" cy="60" rx="20" ry="15" fill="white" opacity="0.95"/>
    <!-- Tail -->
    <ellipse cx="75" cy="30" rx="20" ry="20" fill="white" opacity="0.95"/>
  </g>
</svg>