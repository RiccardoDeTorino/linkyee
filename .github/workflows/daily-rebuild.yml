name: Daily Rebuild
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec ruby ./scaffold.rb
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_output
      - uses: actions/deploy-pages@v4